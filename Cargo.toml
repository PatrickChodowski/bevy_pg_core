[package]
name = "bevy_pg_core"
version = "1.20.0"
edition = "2024"

[dependencies]
bevy = {version="0.20", features=["bevy_asset", "bevy_state", "bevy_camera", "bevy_log"], default-features=false}
libm = "0.2.16"
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
serde = { version = "1.0", features = ["derive"] }


[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"
